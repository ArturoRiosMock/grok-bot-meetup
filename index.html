<!doctype html>
<!--
  `lang` is rewritten on startup by src/i18n. Meta tags are in Portuguese for
  the Florianópolis event: social crawlers (X, Slack, Discord) do not run
  JavaScript, so the shared preview is whatever this file serves.
-->
<html lang="pt-BR">
  <head>
    <!-- must sit in the first 1024 bytes, so first -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Grok Bot Meetup</title>
    <meta
      name="description"
      content="Faça check-in e resgate créditos do Cursor."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Grok Bot Meetup" />
    <meta
      property="og:description"
      content="Faça check-in e resgate créditos do Cursor."
    />
    <meta property="og:site_name" content="Grok Bot" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:locale:alternate" content="es_ES" />

    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Absolute URLs only. Update these three if the Vercel host changes.
    -->
    <link rel="canonical" href="https://grok-bot-meetup-beta.vercel.app/" />
    <meta property="og:url" content="https://grok-bot-meetup-beta.vercel.app/" />
    <meta property="og:image" content="https://grok-bot-meetup-beta.vercel.app/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Grok Bot Meetup"
    />

    <link rel="icon" href="/favicon.png?v=mark" type="image/png" sizes="512x512" />
    <link rel="icon" href="/favicon.ico?v=mark" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/favicon.svg?v=mark" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=mark" />

    <meta name="theme-color" content="#f6f6f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0c" media="(prefers-color-scheme: dark)" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
